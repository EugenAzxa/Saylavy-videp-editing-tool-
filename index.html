<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Put together a tribute video for someone you have lost. Everything stays on your own device."
    />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2fa" media="(prefers-color-scheme: light)" />
    <title>Saylavy &middot; Tribute Video Editor</title>

    <!--
      Sets the theme before the first paint, so the page never flashes the
      wrong colours on load. This has to be inline and blocking; moving it into
      the bundle would put it after the browser has already painted.
      Keep the storage key in sync with src/state/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('saylavy-theme')
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This editor needs JavaScript. All the video work happens inside your own browser,
      which is why nothing here runs on a server.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
