<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Put together a tribute video for someone you have lost. Everything stays on your own device."
    />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2fa" media="(prefers-color-scheme: light)" />
    <title>Saylavy &middot; Tribute Video Editor</title>

    <!--
      Applies the saved theme before first paint. Must stay render-blocking:
      no defer, no async, and not moved into the bundle. See public/theme.js
      for why it is a separate file rather than inline.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This editor needs JavaScript. All the video work happens inside your own browser,
      which is why nothing here runs on a server.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
